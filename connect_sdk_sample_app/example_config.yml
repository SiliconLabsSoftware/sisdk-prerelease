      - efr32[fmb]g27
      - efr32[fmbz]g28
      - efr32[fmb]g29
      - mgm.*
      - rm21.*
      - fgm230s.*
    part_blacklist_filter:
      - efr32bg22c112
    part_compatibility:
      - .*efr32[mb]g21.*
      - .*(?!efr32bg22c112)efr32[fmb]g22(?!l).*
      - .*efr32[fmz]g23.*
      - .*(?!efr32bg22c112)efr32[fmb]g24.*
