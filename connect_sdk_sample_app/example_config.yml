    - segger
  connect_ides: &connect_ides
    - generic-template
    - iar-embedded-workbench
    - makefile-ide
    - simplicity-ide
    - visual-studio-code
    - visual-studio-code-cmake
#example specific settings
example:
#connect examples
  - path: example/connect_soc_empty/connect_soc_empty.slcp
