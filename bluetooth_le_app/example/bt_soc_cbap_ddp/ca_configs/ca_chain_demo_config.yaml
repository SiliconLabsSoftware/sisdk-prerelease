---
certificate_authorities:
  - name: root_ca
    provision: true
    private_key_path: ../ca_demo/ca0_root/private_key.pem
    certificate_path: ../ca_demo/ca0_root/certificate.pem
    database_path: ../ca_demo/ca0_root/issued_certificates.yaml
  - name: factory_ca
    provision: true
    private_key_path: ../ca_demo/ca1_factory/private_key.pem
    certificate_path: ../ca_demo/ca1_factory/certificate.pem
    database_path: ../ca_demo/ca1_factory/issued_certificates.yaml
  - name: batch_ca
    provision: true
    private_key_path: ../ca_demo/ca2_batch/private_key.pem
    certificate_path: ../ca_demo/ca2_batch/certificate.pem
    database_path: ../ca_demo/ca2_batch/issued_certificates.yaml

device_certificate:
  create_and_provision: true
  issuer: batch_ca
