id=com.silabs.sdk.stack.sisdk

version=2025.12.0

label=Simplicity SDK Suite
description=Simplicity SDK Suite

#names for the studio package manager
pkg_label=Simplicity Platform
pkg_description=Silicon Labs Gecko Platform

#Build Information
codeQuality=GA
buildNumber=0
# Look in these locations for extra properties
#   note that the single .properties input is a hack so that this will work while the stacks are updated
extendedProperties=usb/protocol/usb/usb.properties bootloader/platform/bootloader/esf.properties micriumos/platform/micrium_os/micrium-krnx.properties platform_common_apps/app/common/app_common.properties wisun_config_generator/wisun_config_generator.slsdk zigbee/zigbee.slsdk wisun_ncp_app/wisun_ncp_app.slsdk zwave_cc_configurator/z-wave_cc_configurator.slsdk zwave_bootloader/z-wave_bootloader.slsdk wisun_ddp_app/wisun_ddp_app.slsdk wisun_rcp_app/wisun_rcp_app.slsdk bluetooth_mesh_app/bluetooth_mesh_app.slsdk zigbee_app/zigbee_app.slsdk wisun_sdk/wisun_sdk.slsdk platform_security_sample_app/app/common/platform_security_sample_app.slsdk connect_sdk/connect_sdk.slsdk connect_sdk_sample_app/connect_sdk_sample_app.slsdk rail_sdk/rail_sdk.slsdk wisun_cli_app/wisun_cli_app.slsdk connect_stack/connect.slsdk bootloader_sample_app/platform/bootloader/bootloader_sample_app.slsdk rail_sdk_sample_app/rail_sdk_sample_app.slsdk platform_sample_app/app/common/platform_sample_app.slsdk zwave_sample_app/z-wave_sample_app.slsdk wisun_sdk_sample_app/wisun_sdk_sample_app.slsdk bluetooth_le_app/bluetooth_le_app.slsdk openthread_app/openthread_app.slsdk multiprotocol_app/multiprotocol_app.slsdk extension/find-my-sdk/find_my_app.slsdk extension/aiml-extension/aiml.slsdk extension/sqa_package/sqa.slsdk extension/amazon-sidewalk/sidewalk.slsdk extension/wifi_sqa_internal/wifi_sqa_internal.slsdk extension/test_agent_package/test_agent.slsdk extension/wiseconnect/wiseconnect.slsdk extension/matter_extension/matter.slsdk

# Ensure protocols dont break board compatibility
prop.boardCompatibility=.*

# ESF
prop.requiredFeatureLevel=esf:2;app_framework:143
# ---- Location of apack.info ----
prop.file.adapterPacks=aiml/tool/tflite bluetooth_mesh_middleware/script/generator bluetooth_bgbuild radio_config_generator wisun_config_generator zwave_cc_configurator
prop.supportModules=true
prop.useAdditionalLibraries=true

prop.file.hwconfFile=pintool/platform/hwconf_data/hwconfig.hwdata

