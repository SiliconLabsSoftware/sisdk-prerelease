id=com.silabs.sdk.stack.simplicity_sdk

version=2026.12.0

label=Simplicity SDK Suite
description=Simplicity SDK Suite for EFM32 and EFR32 microcontrollers and radios.

#names for the studio package manager
pkg_label=Simplicity Platform
pkg_description=Silicon Labs Gecko Platform

#Build Information
codeQuality=GA
buildNumber=0
# Look in these locations for extra properties
#   note that the single .properties input is a hack so that this will work while the stacks are updated
extendedProperties=micriumos/platform/micrium_os/micrium-krnx.properties connect/connect.slsdk thread_app/thread_app.slsdk compute_app/compute_app.slsdk bluetooth_le_app/bluetooth_le_app.slsdk wisun_ncp_app/wisun_ncp_app.slsdk bluetooth_mesh_app/bluetooth_mesh_app.slsdk zwave/zwave.slsdk zwave_app/zwave_app.slsdk wisun_rcp_app/wisun_rcp_app.slsdk multiprotocol_app/multiprotocol_app.slsdk wisun_ddp_app/wisun_ddp_app.slsdk rail_app/rail_app.slsdk cpc_app/cpc_app.slsdk zigbee/zigbee.slsdk connect_app/connect_app.slsdk wisun/wisun.slsdk rail/rail.slsdk zigbee_app/zigbee_app.slsdk wisun_app/wisun_app.slsdk platform_app_internal/app/common/platform_app_internal.slsdk platform_app/app/common/platform_app.slsdk extension/wiseconnect/wiseconnect.slsdk extension/sqa_package/sqa.slsdk extension/matter/matter.slsdk extension/matter/matter_app.slsdk extension/aliro-extension/aliro.slsdk extension/wifi_sqa_internal/wifi_sqa_internal.slsdk extension/amazon-sidewalk/sidewalk_app.slsdk extension/amazon-sidewalk/sidewalk.slsdk extension/find-my-sdk/find_my_app.slsdk extension/test_agent_package/test_agent.slsdk extension/find-hub-sdk/find_hub_app.slsdk extension/siwx353_alpha/thread_siwx353_app.slsdk extension/siwx353_alpha/zigbee_siwx353.slsdk extension/aiml-extension/aiml.slsdk extension/find-ecosystem-sdk/find_ecosystem_app.slsdk extension/matter_extension/matter.slsdk

# Ensure protocols dont break board compatibility
prop.boardCompatibility=.*

# ESF
prop.requiredFeatureLevel=esf:2;app_framework:143
# ---- Location of apack.info ----
prop.file.adapterPacks=bluetooth_mesh/script/generator bluetooth_bgbuild ninja radio_config_generator
prop.supportModules=true
prop.useAdditionalLibraries=true

prop.file.hwconfFile=platform_core/platform/hwconf_data/hwconfig.hwdata

# (V)SE files
prop.file.seFirmwareFolders=se_firmware_xg23 se_firmware_xg26 se_firmware_xg22 se_firmware_xg21 se_firmware_xg24 se_firmware_xg27 se_firmware_x301 se_firmware_xg28 se_firmware_xg25 se_firmware_xg29 se_firmware_xg2d

# Toolchains versions
