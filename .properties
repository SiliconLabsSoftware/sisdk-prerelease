id=com.silabs.sdk.stack.sisdk

version=2025.12.0

label=Simplicity SDK Suite
description=Simplicity SDK Suite

#names for the studio package manager
pkg_label=Simplicity Platform
pkg_description=Silicon Labs Gecko Platform

#Build Information
codeQuality=GA
buildNumber=0
# Look in these locations for extra properties
#   note that the single .properties input is a hack so that this will work while the stacks are updated
extendedProperties=wisun_sdk/esf.properties usb/protocol/usb/usb.properties connect_sdk/esf.properties rail_sdk/esf.properties bootloader/platform/bootloader/esf.properties micriumos/platform/micrium_os/micrium-krnx.properties platform_common_apps/app/common/app_common.properties wisun_config_generator/wisun_config_generator.slsdk zigbee/zigbee.slsdk bluetooth_mesh_app/bluetooth_mesh.slsdk rail_sdk_sample_app/rail_sdk_sample_app.slsdk openthread/openthread.slsdk wisun_sdk_sample_app/wisun_sdk_sample_app.slsdk bluetooth_le_app/bluetooth_le_app.slsdk multiprotocol/protocol/multiprotocol/multiprotocol.slsdk extension/matter_extension/matter.slsdk extension/aiml-extension/aiml.slsdk extension/amazon-sidewalk/sidewalk.slsdk extension/wiseconnect/wiseconnect.slsdk

# Ensure protocols dont break board compatibility
prop.boardCompatibility=.*

# ESF
prop.requiredFeatureLevel=esf:2;app_framework:143
# ---- Location of apack.info ----
prop.file.adapterPacks=aiml/tool/tflite bluetooth_bgbuild bluetooth_mesh_middleware/script/generator radio_config_generator wisun_config_generator zwave_cc_configurator
prop.supportModules=true
prop.useAdditionalLibraries=true

# (V)SE files
# TODO(luthomas): figure out if this is still needed
# prop.file.seFirmwareFolders=util/se_release/public